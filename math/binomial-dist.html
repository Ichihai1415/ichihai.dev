<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>二項分布シミュレーター</title>
        <link rel="stylesheet" href="/common.css" />
        <style>
            html,
            body {
                max-width: 512px;
            }

            table {
                border-collapse: collapse;
            }
            tr {
                padding: 0;
                margin: 0;
            }
            th,
            td {
                border: 1px solid #000;

                padding: 8px;
                margin: 0;
                text-align: right;
            }

            canvas {
                width: 512px;
                height: 512px;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.7.2/Chart.bundle.js"></script>
    </head>
    <body>
        <h1>二項分布シミュレーター</h1>
        分岐回数: <input type="number" id="n" value="9" /><br />
        試行回数: <input type="number" id="count" value="100" /><br />
        <button onclick="cal()">計算</button><br /><br />
        <canvas id="chart"></canvas>
        <table>
            <tr>
                <th>index</th>
                <th>num</th>
            </tr>
            <!--
            <tr>
                <td>0</td>
                <td>12245665</td>
            </tr>-->
        </table>
        <script src="/js/common.js"></script>
        <script>
            let record = [];

            function cal() {
                const n = document.getElementById("n").value;
                console.log(n);
                record = [0];
                for (let i = 0; i <= n; i++) {
                    record[i] = 0;
                }
                console.log(record);
                const count = document.getElementById("count").value;
                for (let i = 0; i < count; i++) {
                    let loc = 0; //現在の位置
                    for (let j = 0; j < n; j++) {
                        const r = get01();
                        //console.log(r);
                        loc += r;
                    }
                    record[loc]++;
                }
                console.log(record);
                tableUpdate();
            }

            function get01() {
                const r = Math.random();
                if (r < 0.5) {
                    return 0;
                } else {
                    return 1;
                }
            }

            function tableUpdate() {
                const table = document.querySelector("table");
                const n = document.getElementById("n").value;
                let newTable = `<tr><th>index</th><th>num</th></tr>`;
                for (let i = 0; i < record.length; i++) {
                    newTable += `<tr><td>${i}</td><td>${record[i]}</td></tr>`;
                }
                table.innerHTML = newTable;
                drawChart();
            }

            function drawChart() {
                const ctx = document.getElementById("chart").getContext("2d");
                const n = document.getElementById("n").value;
                const labels = Array.from(
                    { length: Number(n) + 1 },
                    (_, i) => i
                );
                const data = {
                    labels: labels,
                    datasets: [
                        {
                            label: "二項分布",
                            data: record,
                            backgroundColor: "rgba(75, 192, 192, 0.2)",
                            borderColor: "rgba(75, 192, 192, 1)",
                            borderWidth: 1,
                        },
                    ],
                };
                const options = {
                    scales: {
                        y: {
                            beginAtZero: true,
                        },
                    },
                };
                new Chart(ctx, {
                    type: "bar",
                    data: data,
                    options: options,
                });
            }
        </script>
    </body>
</html>
