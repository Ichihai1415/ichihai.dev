            <h1>二項分布シミュレーター</h1>
            ちょっと怪しいので改善をお待ちください。<br />
            分岐個数: <input type="number" id="n" value="15" /><br />
            試行回数: <input type="number" id="count" value="1000" /><br />
            <button onclick="cal()">計算</button><br /><br />
            <canvas id="chart"></canvas>
            <table>
                <tr>
                    <th>index</th>
                    <th>num</th>
                </tr>
                <tr>
                    <td>0</td>
                    <td>0</td>
                </tr>
            </table>
        </main>

        <footer><!--/js/common.js で追加される--></footer>
    <script>
        let record = [];

        function cal() {
            //todo:中心スタートで+-1動くように　個数ではなく回数に
            const n = document.getElementById("n").value;
            console.log(n);
            record = [0];
            for (let i = 0; i <= n; i++) {
                record[i] = 0;
            }
            console.log(record);
            const count = document.getElementById("count").value;
            for (let i = 0; i < count; i++) {
                let loc = 0; //現在の位置
                for (let j = 0; j < n; j++) {
                    const r = get01();
                    //console.log(r);
                    loc += r;
                }
                record[loc]++;
            }
            console.log(record);
            tableUpdate();
        }

        function get01() {
            const r = Math.random();
            if (r < 0.5) {
                return 0;
            } else {
                return 1;
            }
        }

        function tableUpdate() {
            const table = document.querySelector("table");
            const n = document.getElementById("n").value;
            let newTable = `<tr><th>index</th><th>num</th></tr>`;
            for (let i = 0; i < record.length; i++) {
                newTable += `<tr><td>${i}</td><td>${record[i]}</td></tr>`;
            }
            table.innerHTML = newTable;
            drawChart();
        }

        let ct;

        function drawChart() {
            if (ct) ct.destroy();

            const ctx = document.getElementById("chart").getContext("2d");
            const n = document.getElementById("n").value;
            const labels = Array.from({ length: Number(n) + 1 }, (_, i) => i);
            const data = {
                labels: labels,
                datasets: [
                    {
                        label: "二項分布",
                        data: record,
                        backgroundColor: "rgba(75, 192, 192, 0.2)",
                        borderColor: "rgba(75, 192, 192, 1)",
                        borderWidth: 1,
                    },
                ],
            };
            const options = {
                scales: {
                    y: {
                        beginAtZero: true,
                    },
                },
            };
            ct = new Chart(ctx, {
                type: "bar",
                data: data,
                options: options,
            });
        }
    </script>
