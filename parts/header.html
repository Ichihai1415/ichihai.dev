<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ichihai.dev header</title>
        <style>
            body {
                width: 100vw;
                margin: 0%;
                color: white;
            }

            .header {
                height: 70px;
                padding: 10px;
                font-size: 32px;
                color: white;
                background-color: rgb(0, 0, 0);
                display: flex;
            }

            .icon {
                padding: 3px;
                font-size: 16px;
            }

            .header-main {
                padding: 0px;
                padding-right: 40px;
                font-size: 48px;
            }

            .header-tab {
                padding: 10px;
                margin-top: 4px;
                text-decoration: underline;
            }

            .header-link {
                text-decoration: none;
                color: white;
            }

            .header-sub {
                transition: 1s;
            }

            .header-sub:hover {
                background-color: #444;
            }

            @media screen and (max-width: 600px) {
                .header-sub {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <a class="header-link" href="/game/icon.html"
                ><img
                    class="icon"
                    src="/icon/new_main.png"
                    alt="icon"
                    width="64px"
                    height="64px"
            /></a>
            <a class="header-link" href="/index.html"
                ><div class="header-main">ichihai.dev</div></a
            >
            <div class="header-sub">
                <a class="header-link" href="/tools/"
                    ><div class="header-tab">tools</div></a
                >
            </div>
        </div>
    </body>
</html>
