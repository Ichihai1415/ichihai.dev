<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ichihai.dev header</title>
        <style>
            body {
                margin: 0%;
                color: white;
            }

            .header {
                height: 70px;
                padding: 10px;
                font-size: 32px;
                color: white;
                background-color: rgb(0, 0, 0);
                display: flex;
            }

            .icon {
                font-size: 16px;
            }

            .header-main {
                padding: 0 10px 0 0;
                font-size: 48px;
            }

            .header-tab {
                height: 70px;
                padding: 10px;
                margin-top: 4px;
                text-decoration: underline;
            }

            .header-link {
                text-decoration: none;
                color: white;
            }

            .header-tab:hover {
                background-color: #444;
            }

            .header-menu-icon-wrap {
                margin-left: auto;
            }

            @media screen and (max-width: 410px) {
                .header-main {
                    height: 100%;
                    padding-top: 12px;
                    font-size: 30px;
                }
            }

            @media screen and (max-width: 320px) {
                .header-main {
                    display: none;
                }
            }

            .header-sub {
                display: none; /*通常none、テスト時flex*/
                background-color: #222;
            }

            .header-sub-link-wrap {
                padding: 0 10px;
                transition: 0.2s;
            }

            .header-sub-link-wrap:hover {
                background-color: #444;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <a class="header-link" href="/game/icon.html"
                ><img
                    class="icon"
                    src="/icon/new_main.png"
                    width="70px"
                    height="70px"
                    alt="icon"
            /></a>
            <a class="header-link" href="/index.html"
                ><div class="header-main">ichihai.dev</div></a
            >
            <div class="header-menu-icon-wrap">
                <img
                    class="header-menu-icon"
                    src="/parts/sansen.svg"
                    width="70px"
                    height="70px"
                    alt="menu"
                />
            </div>
        </div>
        <div class="header-sub">
            <div class="header-sub-link-wrap">
                <a class="header-link" href="/tools/index.html">Tools</a>
            </div>
            <div class="header-sub-link-wrap">
                <a class="header-link" href="/webapp/index.html">WebApps</a>
            </div>
            <div class="header-sub-link-wrap">
                <a class="header-link" href="/game/index.html">Games</a>
            </div>
            <div class="header-sub-link-wrap">
                <a class="header-link" href="/sitemap.html">Sitemap</a>
            </div>
            <div class="header-sub-link-wrap">
                <a class="header-link" href="/aboutme/links.html">Links</a>
            </div>
        </div>
    </body>
</html>
