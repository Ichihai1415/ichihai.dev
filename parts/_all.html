<!doctype html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>共通パーツtemplate置き場</title>
        <style></style>
    </head>
    <body>
        <template id="div.common-comment">
            <div class="info-cyan">
                <div class="info-cyan-head">【お知らせ（共通）】2026/04/27</div>
                共通部分の処理を仮調整したため不具合がある可能性があります。
            </div>
        </template>
        <template id="header">
            <style>
                body {
                    margin: 0;
                }

                .header {
                    height: 70px;
                    padding: 10px;
                    margin: 0%;
                    font-size: 32px;
                    color: white;
                    background-color: rgb(0, 0, 0);
                    display: flex;
                }

                .icon {
                    font-size: 16px;
                }

                .header-main {
                    padding: 0 10px 0 0;
                    font-size: 48px;
                }

                .header-tab {
                    height: 70px;
                    padding: 10px;
                    margin-top: 4px;
                    text-decoration: underline;
                }

                .header-link {
                    text-decoration: none;
                    color: white;
                }

                .header-tab:hover {
                    background-color: #444;
                }

                .header-menu-icon-wrap {
                    margin-left: auto;
                }

                @media screen and (max-width: 410px) {
                    .header-main {
                        height: 100%;
                        padding-top: 12px;
                        font-size: 30px;
                    }
                }

                @media screen and (max-width: 320px) {
                    .header-main {
                        display: none;
                    }
                }

                .header-sub {
                    display: none; /*通常none、テスト時flex*/
                    background-color: #222;
                }

                .header-sub-link-wrap {
                    padding: 0 10px;
                    transition: 0.2s;
                }

                .header-sub-link-wrap:hover {
                    background-color: #444;
                }
            </style>
            <div class="header">
                <a class="header-link" href="/game/icon.html"
                    ><img
                        class="icon"
                        src="/icon/new_main.png"
                        width="70px"
                        height="70px"
                        alt="icon"
                /></a>
                <a class="header-link" href="/index.html"
                    ><div class="header-main">ichihai.dev</div></a
                >
                <div class="header-menu-icon-wrap">
                    <img
                        class="header-menu-icon"
                        src="/parts/sansen.svg"
                        width="70px"
                        height="70px"
                        alt="menu"
                    />
                </div>
            </div>
            <div class="header-sub">
                <div class="header-sub-link-wrap">
                    <a class="header-link" href="/tools/index.html">Tools</a>
                </div>
                <div class="header-sub-link-wrap">
                    <a class="header-link" href="/webapp/index.html">WebApps</a>
                </div>
                <div class="header-sub-link-wrap">
                    <a class="header-link" href="/game/index.html">Games</a>
                </div>
                <div class="header-sub-link-wrap">
                    <a class="header-link" href="/sitemap.html">Sitemap</a>
                </div>
                <div class="header-sub-link-wrap">
                    <a class="header-link" href="/aboutme/links.html">Links</a>
                </div>
            </div>
        </template>
        <template id="footer">
            <style>
                .footer {
                    color: black;
                    background-color: #bbb;
                    justify-content: center;
                }

                .footer-italic {
                    font-style: italic;
                }

                .footer-link {
                    text-decoration: none;
                    color: black;
                    font-weight: bold;
                }

                .footer-link:hover {
                    color: #444;
                }

                .footer-text {
                    text-align: center;
                    padding: 4px;
                }
            </style>
            <div class="footer">
                <div class="footer-text">
                    <a class="footer-link" href="https://ichihai.dev"
                        >ichihai.dev</a
                    >
                    - (c) 2024 Ichihai1415 All right reserved.
                </div>
            </div>
        </template>
        <template id="nav.go2top">
            <style>
                /*参考: https://qiita.com/UziDeer/items/3028e44a15f2c8cd6faf*/
                nav.go2top {
                    position: sticky;
                    top: -60px;
                }

                nav.go2top > a {
                    display: block;
                    position: absolute;
                    top: 100vh;
                    right: 20px;
                    width: 40px;
                    height: 40px;
                    color: #fff;
                    background-color: #0006;
                    border-radius: 100%;
                    text-decoration: none;
                }

                nav.go2top > a > img {
                    border-radius: 100%;
                }
            </style>
            <a href="#"
                ><svg
                    viewBox="0 0 64 64"
                    xmlns="http://www.w3.org/2000/svg"
                    xmlns:xlink="http://www.w3.org/1999/xlink"
                >
                    <style>
                        .move1 {
                            transition: 0.5s;
                            transition-delay: 0.25s;
                        }

                        svg:hover > .move1 {
                            transition: 0.75s;
                            transition-delay: 0s;
                            transform: translate(0, -8px);
                        }

                        .move2 {
                            transition: 0.75s;
                            transition-delay: 0s;
                        }

                        svg:hover > .move2 {
                            transition: 0.5s;
                            transition-delay: 0.25s;
                            transform: translate(0, 8px);
                        }

                        .change-color1 {
                            transition: 1s;
                        }

                        svg:hover > .change-color1 {
                            transition: 1.25s;
                            fill: #0008;
                        }
                    </style>

                    <circle
                        cx="32"
                        cy="32"
                        r="32"
                        fill="#0006"
                        stroke-width="0"
                        class="change-color1"
                    />
                    <path
                        d="M 12 40 L 32 16 L 52 40"
                        stroke="white"
                        fill="transparent"
                        stroke-width="4"
                        class="move1"
                    />
                    <path
                        d="M 12 40 L 32 16 L 52 40"
                        stroke="white"
                        fill="transparent"
                        stroke-width="4"
                        class="move2"
                    />
                </svg>
            </a>
        </template>
    </body>
</html>
