<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>cmd textarea</title>
        <style>
            :root {
                --titlebar: var(--titlebar-focus); /*ここで変えれる*/
                --titlebar-focus: #07e;
                --titlebar-unfocus: #202020;
            }

            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            .cmd {
                height: calc(100vh - 2px);
                max-height: calc(100vh - 2px);
                border: 1px solid var(--titlebar);
            }

            .cmd-titlebar {
                height: 32px;
                display: flex;
                font-size: 12px;
                color: #fff;
                background-color: var(--titlebar);
            }

            .cmd-icon {
                width: 16px;
                height: 12px;
                margin: auto 8px;
                border: 1px solid #999;
            }

            .cmd-icon-titlebar {
                height: 3px;
                display: flex;
                background-color: #ddd;
            }

            .cmd-icon-button {
                width: 1px;
                height: 1px;
                margin: 1px;
                margin-left: 0;
                background-color: #999;
            }

            .cmd-icon-text {
                margin: auto 0;
                font-size: 6px;
                text-align: center;
                color: #fff;
                background-color: #000;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            .cmd-titlebar-text {
                margin: auto 0;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            .cmd-titlebar-button {
                width: 48px;
                margin: -1px -1px 0 1px;
                border: none;
                font-size: 16px;
                color: #fff;
                background-color: var(--titlebar);
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            .cmd-titlebar-button#cmd-titlebar-min {
                margin-left: auto;
            }

            .cmd-titlebar-button#cmd-titlebar-min:hover,
            .cmd-titlebar-button#cmd-titlebar-max:hover {
                background-color: #fff2;
            }

            .cmd-titlebar-button#cmd-titlebar-min.disabled:hover,
            .cmd-titlebar-button#cmd-titlebar-max.disabled:hover {
                background-color: var(--titlebar);
            }

            .cmd-titlebar-button#cmd-titlebar-close:hover {
                background-color: #f00;
            }

            .cmd-textarea {
                width: 100%;
                height: calc(100% - 32px);
            }

            #cmd {
                width: 100%;
                padding: 0;
                border: none;
                color: #c0c0c0;
                background-color: #000;
                resize: none;
                outline: none;
                scrollbar-color: #959595 #171717;
                overflow-y: scroll;
            }

            #cmd::-webkit-scrollbar {
                background-color: #171717;
            }

            #cmd::-webkit-scrollbar-thumb {
                background-color: #959595;
            }

            #cmd::selection {
                color: #333;
                background-color: #f3f3f3;
            }

            .cmd-titlebar-button::after {
                position: absolute;
                transform: translateX(-100%);
                border: 1px solid black;
                background: white;
                color: black;
                padding: 2px 4px;
                font-size: 12px;
                white-space: pre;
                opacity: 0;
                pointer-events: none;
                text-align: left;
            }

            .cmd-titlebar-button:hover::after {
                opacity: 1;
                transition: 0.1s;
                transition-delay: 0.5s;
            }

            #cmd-titlebar-min::after {
                content: "textarea部分の表示/非表示を切り替えます。";
            }

            #cmd-titlebar-max::after {
                content: "新しいウィンドウで最大化して表示します。\aすでに最大化されている場合無効です。";
            }

            #cmd-titlebar-close::after {
                content: "この要素を消します。最大化している場合タブを閉じます。\aただし戻るボタンが有効な場合は戻ります。";
            }
        </style>
    </head>
    <body>
        <div class="cmd">
            <div class="cmd-titlebar">
                <div class="cmd-icon">
                    <div class="cmd-icon-titlebar">
                        <div
                            class="cmd-icon-button"
                            style="margin-left: auto"
                        ></div>
                        <div class="cmd-icon-button"></div>
                        <div class="cmd-icon-button"></div>
                    </div>
                    <div class="cmd-icon-text">i:\_</div>
                </div>
                <span class="cmd-titlebar-text"
                    >コマンドプロンプトのようなテキストボックス</span
                >
                <button
                    class="cmd-titlebar-button"
                    id="cmd-titlebar-min"
                    aria-label="minimize"
                >
                    －
                </button>
                <button
                    class="cmd-titlebar-button"
                    id="cmd-titlebar-max"
                    aria-label="maximize"
                >
                    ☐
                </button>
                <button
                    class="cmd-titlebar-button"
                    id="cmd-titlebar-close"
                    aria-label="close"
                >
                    ✕
                </button>
            </div>
            <textarea
                id="cmd"
                class="cmd-textarea"
                spellcheck="false"
                aria-label="cmd"
            >
Ichihai.dev - textarea cmd
(c) 2024 Ichihai1415

cmd@ichihai.dev&gt;</textarea
            >
        </div>
        <script>
            let isDisplay = true;
            function minimize() {
                if (isDisplay) {
                    document.querySelector(".cmd-textarea").style =
                        "display: none;";
                    document.querySelector(".cmd").style = "height: 32px;";
                } else {
                    document.querySelector(".cmd-textarea").style =
                        "display: block;";
                    document.querySelector(".cmd").style = "";
                }
                isDisplay = !isDisplay;
            }

            function maximize() {
                if (window.top != window.self) {
                    window.open("/parts/cmd.html");
                }
            }

            function closeWindow() {
                if (window.top == window.self) {
                    if (window.history.length == 1) window.close();
                    else window.history.back();

                    //open("", "_self").close();//無理やり
                } else {
                    document.querySelector(".cmd").innerText = "";
                    //document.querySelector(".cmd").style =
                    //    "display: none; height: 0px;";
                    document.querySelector("html").style =
                        "display: none; height: 0px;"; //これでもiframe枠は残る
                }
            }

            document.getElementById("cmd-titlebar-min").onclick = minimize;
            document.getElementById("cmd-titlebar-max").onclick = maximize;
            document.getElementById("cmd-titlebar-close").onclick = closeWindow;

            if (window.top == window.self) {
                let button_max = document.getElementById("cmd-titlebar-max");
                button_max.style = "color: gray;";
                button_max.disabled = true;
                button_max.classList.add("disabled");

                document.getElementById("cmd-titlebar-close").hover = "";
            }
        </script>
    </body>
</html>
