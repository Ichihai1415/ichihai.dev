    <body>
        <header><!--/js/common.js で追加される--></header>
        <main>
            <ichihai1415_common-comment
                ><!--/js/common.js で追加される--></ichihai1415_common-comment
            >
            <h1>Text GZip tool</h1>
            <div class="update-date">2026/04/17作成 2026/04/17更新</div>
            <textarea id="in"></textarea>
            <br />
            <button id="comp">圧縮</button>
            <button id="decomp">展開</button>
            <button id="spacedel">空白削除</button>
            <button id="spacedelcomp">空白削除+圧縮</button>
            <button id="geonullrm">geojson null del</button>
            <button id="geoall">geojson一括</button>
            <br />
            <textarea id="out"></textarea>
        </main>
        <footer><!--/js/common.js で追加される--></footer>
        <script></script>
        <script defer type="module">
            //使う場合
            import * as ichihai from "/js/ichihai.js";

            document.getElementById("comp").onclick = async () => {
                document.getElementById("out").value =
                    await ichihai.gzipCompress(
                        document.getElementById("in").value,
                    );
            };

            document.getElementById("decomp").onclick = async () => {
                document.getElementById("out").value =
                    await ichihai.gzipDecompress(
                        document.getElementById("in").value,
                    );
            };

            document.getElementById("spacedel").onclick = async () => {
                document.getElementById("out").value = document
                    .getElementById("in")
                    .value.replace(/\s+/g, "");
            };

            document.getElementById("spacedelcomp").onclick = async () => {
                document.getElementById("out").value =
                    await ichihai.gzipCompress(
                        document.getElementById("in").value.replace(/\s+/g, ""),
                    );
            };

            document.getElementById("geonullrm").onclick = () => {
                let json = JSON.parse(document.getElementById("in").value);
                json.features = json.features.filter(
                    (f) => f.geometry !== null,
                );
                document.getElementById("out").value = JSON.stringify(json);
            };

            document.getElementById("geoall").onclick = async () => {
                let json = JSON.parse(
                    document.getElementById("in").value.replace(/\s+/g, ""),
                );
                json.features = json.features.filter(
                    (f) => f.geometry !== null,
                );
                document.getElementById("out").value =
                    await ichihai.gzipCompress(JSON.stringify(json));
            };
        </script>
    </body>
