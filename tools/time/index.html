<!DOCTYPE html>
<html lang="ja">
    <head>
        <title>日付時刻表示</title>
        <style>
        @font-face {
            font-family: DSEG7;
            src: url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.woff2") format("woff2"),
            url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.woff") format("woff"),
            url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.ttf") format("ttf");
        }

        @font-face {
            font-family: DSEG14;
            src: url("/font/DSEG/DSEG14-Classic/DSEG14Classic-Regular.woff2") format("woff2"),
            url("/font/DSEG/DSEG14-Classic/DSEG14Classic-Regular.woff") format("woff"),
            url("/font/DSEG/DSEG14-Classic/DSEG14Classic-Regular.ttf") format("ttf");
        }

        .dateBack {
            font-family: DSEG14;
            font-size: 7.62vw;
            color: #eee;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -100%);
        }

        .dateMain {
            color:black;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .dateNum {
            font-family: DSEG7;
        }

        .timeBack {
            font-family: DSEG7;
            font-size: 18vw;
            color: #eee;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, 0%);
        }

        .timeMain {
            color:black;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        </style>
    </head>
    <body>
        デバイスの時間が表示されます。<a href="https://www.keshikan.net/fonts.html">Font "DSEG" by けしかん</a>
        <div class="main">
            <div class="dateBack">
                <span class="dateNum">8888</span>/<span class="dateNum">88</span>/<span class="dateNum">88</span>(~~~)
                <div class="dateMain" id="date"></div>
            </div>
            <div class="timeBack">
                88:88:88
                <div class="timeMain" id="time"></div>
            </div>
        </div>
        <noscript>
        <span style="color:red; font-size: 20px;">JavaScriptを有効にしてください。</span>
        </noscript>
    </body>
    <script>
        function plus0(num) {
            let newNum = num;
            if(num < 10) {
                newNum = "0" + num;
            }
            return newNum;
        }

        const date = document.getElementById("date");
        const time = document.getElementById("time");

        function showClock() {
            let nowTime = new Date();
            let nowYear = nowTime.getFullYear();
            let nowMonth = plus0(nowTime.getMonth() + 1);
            let nowDate = plus0(nowTime.getDate());
            let nowDay = nowTime.toString().split(" ")[0];
            let nowTimeHour = plus0(nowTime.getHours());
            let nowTimeMin  = plus0(nowTime.getMinutes());
            let nowTimeSec  = plus0(nowTime.getSeconds());
            let nowDateString = '<span class="dateNum">' + nowYear + '</span>/<span class="dateNum">' + nowMonth + '</span>/<span class="dateNum">' + nowDate + '</span>(' + nowDay + ')';
            let nowMS = nowTime.getMilliseconds();
            //let colon = nowMS < 500 ? ":" : " ";//なぜか改行される
            let colon = ":";
            let nowTimeString = nowTimeHour + colon + nowTimeMin + colon + nowTimeSec;
            date.innerHTML = nowDateString;
            time.innerHTML = nowTimeString;
            //console.log(nowTime.getMonth());
        
        }

        setInterval("showClock()", 1000);
        showClock();
    </script>
</html>
