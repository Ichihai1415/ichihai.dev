<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <title>JMA XML Viewer</title>
        <style>
            table.data-list {
                border: 2px solid black;
                border-collapse: collapse;
                width: 100%;
            }

            th,
            td {
                border: 1px solid gray;
            }

            tr:first-child {
                border: 2px solid black;
            }

            code {
                padding: 3px;
                background-color: lightgrey;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <div class="info" id="info">表示されない場合データの指定が間違っている可能性があります。開発者モードのコンソールを確認してください。</div>
        <table class="data-list" id="data-list">
            <!--例
            <tr class="data-head">
                <th class="title">タイトル</th>
                <th class="id">ID</th>
                <th class="author">発表管轄</th>
                <th class="updated">発表日時</th>
                <th class="content">内容</th>
                <th class="link">リンク</th>
            </tr>
            <tr class="urls-entry">
                <td>気象特別警報・警報・注意報</td>
                <td>VPWW53</td>
                <td>沖縄気象台</td>
                <td>2024-09-07T05:31:09Z</td>
                <td>
                    【沖縄本島地方気象警報・注意報】本島中南部、本島北部では、土砂災害や低い土地の浸水に注意してください。本島中南部では、河川の増水に注意してください。沖縄本島地方では、落雷に注意してください。
                </td>
                <td>
                    <a
                        href="https://www.data.jma.go.jp/developer/xml/data/20240907053110_0_VPWW53_471000.xml"
                        >20240907053110_0_VPWW53_471000.xml</a
                    >
                </td>
            </tr>
            -->
        </table>
    </body>
    <script>
        //const xmlUrl = "https://www.data.jma.go.jp/developer/xml/feed/extra.xml";

        const defTitle = "JMA XML Viewer";

        const table = document.getElementById("data-list");
        const infoDiv = document.getElementById("info");

        window.onload = function () {
            const url = new URL(window.location.href);
            const params = url.searchParams;
            let data = params.get("data");
            if (data == null) {
                infoDiv.innerHTML = `<span style="color:red;">URLパラメータ(取得データ)を指定する必要があります。<br>
                    <code>.../feed.html?data=extra</code> のように指定してください<br>有効値:
                    <code>regular</code> <code>regular_l</code>
                    <code>extra</code> <code>extra_l</code>
                    <code>eqvol</code> <code>eqvol_l</code>
                    <code>other</code> <code>other_l</code></span>`;
                document.title = defTitle;
            } else {
                const url =
                    data == "debug"
                        ? "extra-20240907144122.xml"
                        : `https://www.data.jma.go.jp/developer/xml/feed/${data}.xml`;
                getXml(url);
            }
        };

        function getXml(url) {
            fetch(url)
                .then((res) => {
                    if (res.status >= 200 && res.status < 300) {
                        return res.text();
                    }
                    infoDiv.innerHTML = `<span style="color:red;">取得に失敗しました(${res.status}/${res.statusText})。</span>`;
                    throw new Error(`${res.statusText}(${res.status})`);
                })
                .then((xmlString) => {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(xmlString, "text/xml");
                    displayData(xml);
                    //console.log(xml);
                })
                .catch((e) => {
                    infoDiv.innerHTML = `<span style="color:red;">表示に失敗しました(${error})。</span>`;
                    console.error(e.message);
                });
        }

        function displayData(xml) {
            try {
                infoDiv.innerHTML = `
                更新: <span style="color:blue;">${
                    xml.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "updated"
                    )[0].textContent
                }</span>`;
                let tableHtml = `
            <tr class="data-head">
                <th class="title">タイトル</th>
                <th class="id">ID</th>
                <th class="author">発表管轄</th>
                <th class="updated">発表日時</th>
                <th class="content">内容</th>
                <th class="link">リンク</th>
            </tr>`;

                const items = xml.getElementsByTagNameNS(
                    "http://www.w3.org/2005/Atom",
                    "entry"
                );
                Array.from(
                    xml.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "entry"
                    )
                ).forEach((data) => {
                    let title = data.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "title"
                    )[0].textContent;
                    let author = data.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "author"
                    )[0].textContent;
                    let updated = data.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "updated"
                    )[0].textContent;
                    let content = data.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "content"
                    )[0].textContent;
                    let link = data.getElementsByTagNameNS(
                        "http://www.w3.org/2005/Atom",
                        "id"
                    )[0].textContent;
                    const link_parts = link.split("/");
                    let link_id = link_parts[link_parts.length - 1];
                    const link_parts2 = link_id.split("_");
                    let id = link_parts2[2];
                    tableHtml += `<tr class="data-entry">
                        <td>${title}</td>
                        <td>${id}</td>
                        <td>${author}</td>
                        <td>${updated}</td>
                        <td>${content}</td>
                        <td><a href="${link}" target="_blank">${link_id}</a></td>
                        </tr>`;
                    console.log(
                        `${title}, ${id}, ${author}, ${updated}, ${content}, ${link_id}, ${link}`
                    );
                });
                table.innerHTML = tableHtml;
            } catch (error) {
                infoDiv.innerHTML = `<span style="color:red;">表示に失敗しました(${error})。</span>`;
            }
        }
    </script>
</html>
