<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OBS仮想カメラの映像を表示</title>
        <style>
            body,
            html {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
            }

            video {
                position: absolute;
                width: 100%;
                height: 100%;
                /*object-fit: cover;*/ /*余白なし拡大*/
            }
        </style>
    </head>
    <body>
        <span style="position: absolute; margin: 8px" id="info-text"
            >OBS Virtual Cameraを表示します。<br />
            カメラの許可を押してすぐは表示されないことがあります。リロードすれば表示されます。</span
        >
        <video id="video" autoplay></video>
        <script>
            navigator.mediaDevices
                .getUserMedia({ video: true, audio: false })
                .then((devices) => {})
                .catch((error) => {
                    console.error("権限取得エラー", error);
                });

            const video = document.getElementById("video");
            console.log("権限確認終了");

            navigator.mediaDevices.enumerateDevices().then((devices) => {
                const videoDevices = devices.filter(
                    (device) => device.kind === "videoinput"
                );
                const virtualCam = videoDevices.find((device) =>
                    device.label.includes("OBS Virtual Camera")
                );

                if (virtualCam) {
                    navigator.mediaDevices
                        .getUserMedia({
                            video: { deviceId: virtualCam.deviceId },
                            audio: false,
                        })
                        .then((stream) => {
                            video.srcObject = stream;
                            video.play();
                            document.getElementById("info-text").style.display =
                                "none";
                        })
                        .catch((error) => {
                            console.error(
                                "Error accessing media devices.",
                                error
                            );
                        });
                } else {
                    console.error("OBS Virtual Camera not found.");
                }
            });
        </script>
    </body>
</html>
