        <meta property="og:type" content="website" />

        <link rel="stylesheet" href="/common.css" />
        <script defer src="/js/common.js"></script>

        <style>
            .crypto-out {
                padding-left: 8px;
                border: 1px solid black;
            }

            .crypto-in {
                padding: 0 0 8px 16px;
            }
        </style>
    </head>
    <body>
        <header><!--/js/common.js で追加される--></header>

        <main>
            <h1>暗号化ツール</h1>
            <div class="crypto-out">
                <p style="font-weight: bold">[AES-GCM (256)]</p>
                <div class="crypto-in">
                    plainText: <input type="text" id="AES-GCM_plain" /><br />
                    <button id="AES_GCM_encrypt">↓暗号化</button>
                    <button id="AES_GCM_decrypt">↑復号</button><br />
                    result:
                    <input
                        type="text"
                        id="AES-GCM_result"
                        class="input-result"
                    />, iv: <input type="text" id="AES-GCM_iv" />, key:
                    <input type="text" id="AES-GCM_key" />
                </div>
            </div>
        </main>

        <footer><!--/js/common.js で追加される--></footer>
        <script defer type="module">
            //必要な場合  使わない場合 type="module"は不要
            //import * as ichihai from "/js/ichihai.js";
            import * as crypto_AES_GCM from "/js/crypto/AES-GCM.js";

            async function AES_GCM_encrypt() {
                const plainText =
                    document.getElementById("AES-GCM_plain").value;
                //console.log("[AES_GCM_encrypt]");
                //console.log(plainText);
                const result = await crypto_AES_GCM.encryptText_ReturnKey(
                    plainText
                );
                //console.log("[AES_GCM_encrypt]");
                //console.log(result);
                document.getElementById("AES-GCM_result").value = result.data;
                document.getElementById("AES-GCM_iv").value = result.iv;
                document.getElementById("AES-GCM_key").value = result.key;
            }

            async function AES_GCM_decrypt() {
                const result = document.getElementById("AES-GCM_result").value;
                const iv = document.getElementById("AES-GCM_iv").value;
                const key = document.getElementById("AES-GCM_key").value;
                const plainText = await crypto_AES_GCM.decryptWithBase64Key(
                    iv,
                    result,
                    key
                );
                document.getElementById("AES-GCM_plain").value = plainText;
            }

            document
                .querySelectorAll("input")
                .forEach((inp) =>
                    inp.addEventListener("focus", (event) =>
                        event.target.select()
                    )
                );

            document.getElementById("AES_GCM_encrypt").onclick =
                AES_GCM_encrypt;
            document.getElementById("AES_GCM_decrypt").onclick =
                AES_GCM_decrypt;
        </script>
    </body>
</html>
