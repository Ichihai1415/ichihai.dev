<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.75">
        <title>残り日数表示ページ for ichihai1415</title>
        <style>
            @font-face 
            {
                font-family: DSEG7;
                src: url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.woff2") format("woff2"),
                url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.woff") format("woff"),
                url("/font/DSEG/DSEG7-Classic/DSEG7Classic-Bold.ttf") format("ttf");
            }

            html{
                min-height: 100vh;
            }
            body {
                margin: 0;
            }

            .main {
                min-height: 94vh;
                margin: 0 10px;
            }

            .inputs {
                display: inline-block;
                padding: 5px;
                border: 1px solid #000;
            }

            .userJSONs {
                padding-top: 5px;
            }

            table.dates-list {
                border: 2px solid black;
                border-collapse: collapse;
                width: 100%;
            }

            th,td {
                border: 1px solid gray;
            }

            tr:first-child {
                border: 2px solid black;
            }

            tr.dates-entry-ended {
                background-color: #aaa;
            }

            td.date {
                font-size: 200%;
            }

            td.dates {
                text-align: right;
                padding: 5px 5px 0 0;
            }

            .dates-entry-days {
                display: inline-block;
                position: relative;
                font-family: DSEG7;
                font-size: 300%;
                color: #eee;
            }

            tr.dates-entry-ended .dates-entry-days {
                color: #999;
            }

            .dates-entry-days-fore {
                position: absolute;
                right: 0;
                transform: translate(0, -100%);
                color: black;
            }

            .footer {
                width: 100%;
                padding: 2px 0px;
                text-align: center;
                background-color: #ddd;
            }
        </style>
    </head>
    <body>
        <div class="main">
            <h1>残り日数一覧</h1>
            <p>注意:ダークモード拡張機能が入っていると正常に表示されない場合があります。また一部の端末で位置が少しずれることがあります。</p>
            <p>7セグフォントにDSEG7 Classic Boldを使用しています。<a href="https://www.keshikan.net/fonts.html">7セグ・14セグフォント 「DSEG」</a></p>
            <div class="inputs">
                取得データ:
                <input type="text" id="paramInput">
                <button onclick="addParam()">読み込み</button>
                <div class="userJSONs">
                    <button onclick="">JSONファイル読み込み(未作成)</button>
                    <a href="json-info.html">詳細(未作成)</a>
                </div>
            </div>
            <noscript style="color: red;">JavaScriptを有効にしてください。</noscript>
            <p class="info" id="info"></p>
            <table class="dates-list" id="dates-list">
<!--
                <tr class="dates-head">
                    <th class="date">日付</th>
                    <th class="content">内容</th>
                    <th class="remainDays">日数</th>
                </tr>
                <tr class="dates-entry">
                    <td class="date">2024/05/12</td>
                    <td>全統記述模試#1</td>
                    <td class="dates">
                        <div class="dates-entry-days">888
                            <div class="dates-entry-days-fore">7</div>
                        </div>
                        日
                    </td>
                </tr>
-->
            </table>
        </div>
        <div class="footer">
            © 2024 ichihai1415  
        </div>
    </body>
    <script>
        const infoDiv = document.getElementById("info");
        const table = document.getElementById("dates-list");

        window.onload = function() {
            const url = new URL(window.location.href);
            const params = url.searchParams;
            //console.log(params);
            const data = params.get("data");
            if (data == null) {
                infoDiv.innerHTML = `<span style="color:red;">URLパラメータ(取得データ)を指定する必要があります。</span>`;
            }
            else {
                let url = null;
                if (data == "moshi2024") {
                    url = "moshi2024.json";
                }
                if (url == null){
                    infoDiv.innerHTML = `<span style="color:red;">URLパラメータ(取得データ)が正しくありません。</span>`;
                }
                else {
                    getJSON(url, function(err, json) {
                        if (err !== null) {
                            infoDiv.innerHTML = `<span style="color:red;">取得に失敗しました(${err})。</span>`;
                        } else {
                            displayDates(json);
                        }
                    });
                }
            }
        }

        function addParam() {
            let value = document.getElementById("paramInput").value;
            if (value == "") {
                infoDiv.innerHTML = `<span style="color:red;">空白にすることはできません。</span>`;
                return;
            }
            let curUrl = window.location.href;
            let newUrl = curUrl.split('?')[0] + "?data=" + encodeURIComponent(value);
            window.location.href = newUrl;
        }

        function getJSON(url, callback) {
            console.log("GET " + url)
            let xhr = new XMLHttpRequest();
            xhr.open("GET", url, true);
            xhr.responseType = "json";
            xhr.onload = function() {
                let status = xhr.status;
                if (status === 200) {
                    callback(null, xhr.response);
                } else {
                    callback(status, xhr.response);
                }
            };
            xhr.send();
        };

        function displayDates(json) {
            try {
                let nowDate = new Date();
                infoDiv.innerHTML = 
                `名称: <span style="color:blue;">${json.control.name}</span><br>
                作成者: <span style="color:blue;">${json.control.author}</span><br>
                更新: <span style="color:blue;">${json.control.update}</span><br>
                取得・基準日: <span style="color:blue;">${nowDate.getFullYear()}/${plus0(nowDate.getMonth() + 1)}/${plus0(nowDate.getDate())}</span>`;
                let tableHtml = `<tr class="dates-head"><th class="date">日付</th><th class="content">内容</th><th class="remainDays">日数</th></tr>`;
                json.dates.forEach(dateData => {
                    let date = dateData.date;
                    let content = dateData.content;
                    let remainDays_f = (new Date(date) - nowDate) / 86400000;
                    let tr_class = "dates-entry-ended";
                    if (remainDays_f > 0) {
                        remainDays_f += 1;
                        tr_class = "dates-entry";
                    }
                    let remainDays = parseInt(remainDays_f);
                    let backNum = "";
                    for(let i = 0; i < remainDays.toString().length; i++) {
                        backNum += "8";
                    }
                    if (remainDays >= 0 || !json.isHideOld) {
                        tableHtml += `<tr class="${tr_class}"><td class="date">${date}</td><td>${content}</td><td class="dates"><div class="dates-entry-days">${backNum}<div class="dates-entry-days-fore">${remainDays}</div></div>日</td></tr>`;
                    }
                    console.log(`${date},${content},${remainDays}`);
                });
                table.innerHTML = tableHtml;
            } catch (error) {
                infoDiv.innerHTML = `<span style="color:red;">表示に失敗しました(${error})。</span>`;
            }
        }

        function plus0(num) {
            let newNum = num;
            if (num < 10) {
                newNum = "0" + num;
            }
            return newNum;
        }
    </script>
</html>
