<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>スロットみたいなやつ</title>
        <link rel="stylesheet" href="style.css" />
        <script src="/js/ichihai.js"></script>
    </head>
    <body>
        <main>
            <p>
                money: <span class="gameValue" id="money">500</span>
                <button id="moreMoney" onclick="moreMoney()">
                    more money(+500)</button
                ><br />
                debt: <span class="gameValue" id="debt">500</span>
                <button id="payDebt" onclick="payDebt()">pay debt</button><br />
                bet:
                <input
                    type="number"
                    id="bet"
                    value="10"
                    min="0"
                    onchange="betChange()"
                /><br />
            </p>
            <div class="slot-container">
                <div class="slot-num" id="slot-num1"></div>
                <div class="slot-num" id="slot-num2"></div>
                <div class="slot-num" id="slot-num3"></div>
            </div>
            <div class="slot-container">
                <button class="stop" id="stop-1" onclick="stop1()" disabled>
                    ・
                </button>
                <button class="stop" id="stop-2" onclick="stop2()" disabled>
                    ・
                </button>
                <button class="stop" id="stop-3" onclick="stop3()" disabled>
                    ・
                </button>
            </div>
            <div class="slot-container">
                <button class="stsp" id="start" onclick="start()">start</button>
                <button
                    class="stsp"
                    id="stop-all"
                    onclick="stop_all()"
                    disabled
                >
                    stop all
                </button>
                <button class="stsp" id="fastPlay" onclick="playFast()">
                    play fast
                </button>
            </div>
        </main>
        <script>
            let playing1 = false;
            let playing2 = false;
            let playing3 = false;

            let money = 500;
            let debt = 500;
            let bet = 10;

            function start() {
                playing1 = true;
                playing2 = true;
                playing3 = true;
                document.getElementById("start").disabled = true;
                document.getElementById("stop-1").disabled = false;
                document.getElementById("stop-2").disabled = false;
                document.getElementById("stop-3").disabled = false;
                document.getElementById("stop-all").disabled = false;
                money -= bet;
                if (money < 0) {
                    debt += money;
                    money = 0;
                }
                updateGameValue();
            }

            function stop1() {
                playing1 = false;
                document.getElementById("stop-1").disabled = true;
                const num1 = Math.floor(Math.random() * 10);
                document.getElementById("slot-num1").innerHTML = num1;
                checkResult();
            }

            function stop2() {
                playing2 = false;
                document.getElementById("stop-2").disabled = true;
                const num2 = Math.floor(Math.random() * 10);
                document.getElementById("slot-num2").innerHTML = num2;
                checkResult();
            }

            function stop3() {
                playing3 = false;
                document.getElementById("stop-3").disabled = true;
                const num3 = Math.floor(Math.random() * 10);
                document.getElementById("slot-num3").innerHTML = num3;
                checkResult();
            }

            function stop_all() {
                stop1();
                stop2();
                stop3();
            }

            function playFast() {
                start();
                stop_all();
            }

            function checkResult() {
                if (!playing1 && !playing2 && !playing3) {
                    document.getElementById("start").disabled = false;
                    document.getElementById("stop-1").disabled = true;
                    document.getElementById("stop-2").disabled = true;
                    document.getElementById("stop-3").disabled = true;
                    document.getElementById("stop-all").disabled = true;
                    const value = parseInt(
                        document.getElementById("slot-num1").innerText +
                            document.getElementById("slot-num2").innerText +
                            document.getElementById("slot-num3").innerText
                    );
                    if (value > 900)
                        //temp
                        money += (bet * value) / 10;

                    updateGameValue();
                }
            }

            function updateSlots() {
                if (playing1) {
                    const num1 = Math.floor(Math.random() * 10);
                    document.getElementById("slot-num1").innerHTML = num1;
                }
                if (playing2) {
                    const num2 = Math.floor(Math.random() * 10);
                    document.getElementById("slot-num2").innerHTML = num2;
                }
                if (playing3) {
                    const num3 = Math.floor(Math.random() * 10);
                    document.getElementById("slot-num3").innerHTML = num3;
                }
                setTimeout(updateSlots, 30);
            }

            function moreMoney() {
                money += 500;
                debt += 500;
                updateGameValue();
            }

            function updateGameValue() {
                document.getElementById("money").innerHTML = money;
                document.getElementById("debt").innerHTML = debt;
            }

            function payDebt() {
                if (money >= debt) {
                    money -= debt;
                    debt = 0;
                    updateGameValue();
                }
            }

            function betChange() {
                bet = document.getElementById("bet").value;
                if (bet < 0) {
                    document.getElementById("bet").value = 0;
                } else {
                    document.getElementById("bet").value = money;
                }
            }

            function showAlert(message, style) {}
        </script>
        <script>
            updateSlots();
            let cookies = getCookies();
            if (cookies["money"] != undefined) money = cookies["money"];
            if (cookies["debt"] != undefined) debt = cookies["debt"];
            if (cookies["bet"] != undefined) {
                bet = cookies["bet"];
                document.getElementById("bet").value = bet;
            }
        </script>
    </body>
</html>
