            html,

                height: 100%;

                background-color: #0018;
                z-index: 5;

                font-size: 1.5em;
                font-weight: bold;
                background-color: #0001;
            }

            .setting-open,
            .setting-close {
                margin: 4px;
                float: right;
                border: 1px solid #444;
                padding: 2px;
                border-radius: 4px;
                cursor: pointer;
                background-color: #ddd;
            }

            .setting-open {
                position: absolute;
                left: 8px;
                bottom: 8px;
            }

            .setting-open:hover,
            .setting-close:hover {
                background-color: #ccc;

                border: none;
                background-color: black;

                border: none;
                background-color: #444;
