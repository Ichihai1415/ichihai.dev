        <style>
            html,
            body {
                height: 100%;
                padding: 0;
                margin: 0;
            }

            canvas {
                width: 100%;
                height: 100%;
                overflow: unset;
                display: block;
                background-color: white;
            }

            .on {
                position: absolute;
                top: 0;
                left: 0;
                padding: 0 10px;
                background-color: #ddd;
            }

            .on * {
                margin: 5px;
            }

            .setting-appear{
                position: absolute;
                top: 0;
                right: 0;
            }

            .setting-out {
                display: flex;
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                justify-content: center; 
                align-items: center; 
                background-color: #0018;
            
                display: none;
            }

            .setting {
                background-color: #aab;
                min-width: 400px;
                margin: 10px;
                padding: 6px;
                border-radius: 10px;
            }

            .setting-head {
                margin-left: 10px;
                font-size: 1.5em;
                font-weight: bold;
            }

            .setting-close {
                margin: 4px;
                float: right;
                border: 1px solid #444;
                padding: 2px;
                border-radius: 4px;
                cursor: pointer;
            }

            .setting-close:hover {
                background-color: #888;
            }

            hr {
                height: 2px;
                border: 0px;
                background-color: black;
            }

            hr.l2 {
                height: 1px;
                border: 0px;
                background-color: #444;
            }
        </style>
