<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="robots" content="noindex" />

        <title>文字列2GZip</title>
        <script src="/js/ichihai.js" defer></script>
        <style>
            textarea {
                width: 100%;
                height: 100px;
                margin-top: 6px;
            }
        </style>
    </head>
    <body>
        <textarea
            id="input"
            placeholder="ここに文字列を入力してください"
        ></textarea
        ><br />
        <button id="compress" onclick="compress()">圧縮</button><br />
        <textarea id="output" placeholder="結果が表示されます"></textarea><br />
    </body>
    <script>
        function compress() {
            const input = document.getElementById("input").value;
            gzipCompress(input)
                .then((compressed) => {
                    document.getElementById("output").value = compressed;
                })
                .catch((error) => {
                    console.error("圧縮中にエラーが発生しました:", error);
                    document.getElementById("output").value =
                        "圧縮に失敗しました。";
                });
        }
    </script>
</html>
