<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="robots" content="noindex" />

        <title>文字列2GZip</title>
        <script src="/js/ichihai.js" defer></script>
        <style>
            textarea {
                width: calc(100% - 8px);
                height: 200px;
                margin: 8px 8px 8px 1px;
            }
        </style>
    </head>
    <body>
        <p>
            todo:相互変換をtoolsに作る<br />VS Code
            プレビューでコピーできない場合 Ctrl+Click でブラウザで開くこと。<a
                href="http://127.0.0.1:3000/school/univ/notes/secret/compress.html"
                >http://127.0.0.1:3000/...</a
            >
            /
            <a href="https://ichihai.dev/school/univ/notes/secret/compress.html"
                >https://ichihai.dev/...</a
            >
        </p>
        <textarea
            id="input"
            placeholder="ここに文字列を入力してください"
        ></textarea
        ><br />
        <button id="compress" onclick="compress()">圧縮</button><br />
        <textarea id="output" placeholder="結果が表示されます"></textarea><br />
        <button id="copy" onclick="copy()">コピー</button><br />
    </body>
    <script>
        function compress() {
            const input = document.getElementById("input").value;
            gzipCompress(input)
                .then((compressed) => {
                    document.getElementById("output").value = compressed;
                })
                .catch((error) => {
                    console.error("圧縮中にエラーが発生しました:", error);
                    document.getElementById("output").value =
                        "圧縮に失敗しました。";
                });
        }

        function copy() {
            const output = document.getElementById("output").value;
            if (output) {
                navigator.clipboard
                    .writeText(output)
                    .then(() => {
                        alert("コピーしました。");
                    })
                    .catch((error) => {
                        console.error(error);
                        alert("コピーに失敗しました。");
                    });
            } else {
                alert("コピーする内容がありません。");
            }
        }
    </script>
</html>
