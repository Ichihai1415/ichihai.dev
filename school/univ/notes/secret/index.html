            <div id="result">

        <script defer>
            const id = getParam("id");
            if (id) {
                fetch(
                    `https://ichihai.dev/school/univ/notes/secret/GS/${id}.dat`
                )
                    .then((response) => response.text())
                    .then((text) => {
                        const readable = gzipDecompress(text);
                        document.getElementById("result").innerHTML = readable;
                    });
            }
        </script>
