            </div>

        <footer><!--/js/common.js で追加される--></footer>
        <script defer>
            const id = getParam("id");
            if (id) {
                fetch(
                    `https://ichihai.dev/school/univ/notes/secret/GS/${id}.dat`
                )
                    .then((response) => response.text())
                    .then((text) => {
                        gzipDecompress(text).then((decompressed) => {
                            document.getElementById("result").innerHTML =
                                decompressed;
                        });
                    })
                    .catch((error) => {
                        console.error("Error fetching the file:", error);
                        document.getElementById("result").innerHTML =
                            "指定されたIDのファイルが見つかりません。";
                    });
            }
        </script>
