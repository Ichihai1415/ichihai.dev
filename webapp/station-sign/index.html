<!DOCTYPE html>
<html lang="ja-JP">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>発車標シミュレーター</title>
        <meta name="description" content="発車標シミュレーター" />
        <link rel="stylesheet" href="/common.css" />
        <style>
            :root {
                --dot-color-0: #665555;
                --dot-color-1: #00ff00;
                --dot-color-2: #ffaa00;
                --dot-color-3: #ff0000;
            }

            main {
                min-width: 1800px !important;
            }

            .sign {
                padding: 0px 70px 40px 70px;
                background-color: #222;
                color: #ccc;
            }

            .sign-header {
                height: 160px;
            }

            .sign-header-platform-num-container {
                height: 100px;
                width: 100%;
                display: flex;
                justify-content: space-between;
                font-size: 120px;
                font-weight: 500;
            }

            .sign-header-platform-num {
                padding: 0 10px;
                position: relative;
                top: -30px;
            }

            .sign-header-description-container {
                margin-top: 32px;
                display: flex;
                font-weight: 600;
            }

            .sign-header-description {
                text-align: center;
                font-size: 20px;
            }

            .sign-header-description-en {
                font-size: 0.8em;
            }

            .shd_1 {
                width: 80px;
            }

            .shd_2 {
                width: 160px;
            }

            .shd_3 {
                width: 240px;
            }

            .shd_4 {
                width: 320px;
            }

            .shd_5 {
                width: 400px;
            }

            .shd_7 {
                width: 560px;
            }

            .sign-displays {
                background-color: #292525;
            }

            .sign-display-single {
                display: flex;
                padding: 15px 2px 2px 2px;
            }

            .sign-display-single:first-child {
                padding-top: 5px;
            }

            .sign-display-column {
                display: flex;
                flex-direction: column;
            }

            .sign-display-1cell {
                margin: 1px;
                width: 3px;
                height: 3px;
                border-radius: 100%;
                background-color: #665555;
            }

            .dot-gen-inputs-container {
                display: flex;
            }

            .dot-gen-inputs-i {
                margin-left: 10px;
            }

            .dot-gen-inputs-inp {
                width: 30px;
            }
        </style>
    </head>
    <body>
        <header><!--/js/common.js で追加される--></header>
        <main>
            <div class="spacer"></div>
            <div class="sign" id="tsuruga-platform_3-5">
                <!--別スタイル追加するとき以下のclass名は変えるなどしておく-->
                <div class="sign-header">
                    <div class="sign-header-platform-num-container">
                        <div class="sign-header-platform-num">5</div>
                        <div class="sign-header-platform-num">3</div>
                    </div>
                    <div class="sign-header-description-container">
                        <div class="sign-header-description shd_1"></div>
                        <div class="sign-header-description shd_2">
                            種別
                            <span class="sign-header-description-en">
                                Type</span
                            >
                        </div>
                        <div class="sign-header-description shd_7">
                            列車名
                            <span class="sign-header-description-en"
                                >Train Name</span
                            >
                        </div>
                        <div class="sign-header-description shd_1"></div>
                        <div class="sign-header-description shd_3">
                            時刻
                            <span class="sign-header-description-en">
                                Departure Time</span
                            >
                        </div>
                        <div class="sign-header-description shd_1"></div>
                        <div class="sign-header-description shd_4">
                            行先
                            <span class="sign-header-description-en">
                                Destination</span
                            >
                        </div>
                        <div class="sign-header-description shd_1"></div>
                    </div>
                </div>
                <div class="sign-displays"><!--scriptで自動追加--></div>
            </div>

            <div class="dot-generator">
                ドット作成ツール<br />
                0:消灯 1:緑 2:オレンジ 3:赤
                <button id="dot-gen-display" onclick="updateDot()">表示</button>
                <button id="dot-gen-make" onclick="saveDot()">保存</button>
                <div class="dot-gen-inputs-container">
                    <div class="dot-gen-inputs-v"><!--scriptで自動追加--></div>
                    <div class="dot-gen-inputs-i"><!--scriptで自動追加--></div>
                </div>
            </div>
        </main>

        <footer><!--/js/common.js で追加される--></footer>
        <script src="/js/common.js"></script>
        <script>
            //初期化処理
            const DIS_1 = '<div class="sign-display-1cell"></div>';
            const SIGNS = [["tsuruga-platform_3-5", 16, 320, 3]];

            SIGNS.forEach((s) => {
                let DIS_COLS =
                    '<div class="sign-display-column">' +
                    DIS_1.repeat(s[1]) +
                    "</div>";
                let DIS_SINGLE =
                    '<div class="sign-display-single" style="width: ' +
                    s[2] * 5 +
                    'px;">' +
                    DIS_COLS.repeat(s[2]) +
                    "</div>";
                let DIS_ALL = DIS_SINGLE.repeat(s[3]);

                let sign = document.getElementById(s[0]);
                let dis = sign.querySelector(".sign-displays");
                dis.innerHTML = DIS_ALL;
                sign.style.width = s[2] * 5 + 4 + "px";
            });

            for (let r = 0; r < 320; r++) {
                let nr = document.createElement("span");
                nr.textContent =
                    r +
                    1 +
                    " (" +
                    Math.floor(r / 16 + 1) +
                    "-" +
                    ((r % 16) + 1) +
                    ")";
                document.querySelector(".dot-gen-inputs-v").appendChild(nr);
                document
                    .querySelector(".dot-gen-inputs-v")
                    .appendChild(document.createElement("br"));
                for (let c = 0; c < 16; c++) {
                    let inp = document.createElement("input");
                    inp.type = "number";
                    inp.min = "0";
                    inp.max = "3";
                    inp.value = "0";
                    inp.classList.add("dot-gen-inputs-inp");
                    inp.addEventListener(
                        "change",
                        function () {
                            updateDot();
                        },
                        false
                    ); //自動反映(高負荷)
                    document
                        .querySelector(".dot-gen-inputs-i")
                        .appendChild(inp);
                }
                document
                    .querySelector(".dot-gen-inputs-i")
                    .appendChild(document.createElement("br"));
            }
        </script>
        <script>
            //このへんはAIの自動入力がほぼ完成させてるよ、すごいねAI
            function updateDot() {
                let inputs = document.querySelectorAll(".dot-gen-inputs-inp");
                let dis = document.querySelectorAll(".sign-display-1cell");
                for (let i = 0; i < inputs.length; i++) {
                    let v = inputs[i].value;
                    if (v == "0") {
                        dis[i].style.backgroundColor = "#665555";
                    } else if (v == "1") {
                        //type1
                        dis[i].style.backgroundColor = "#0f0";
                        //type2
                        //dis[i].style.border = "1px solid #0f0";
                        //dis[i].style.margin = "0";
                        //type3
                        //dis[i].style.backgroundColor = "#ffffff";
                        //dis[i].style.border = "1px solid #0f0";
                        //dis[i].style.margin = "0";
                    } else if (v == "2") {
                        dis[i].style.backgroundColor = "#ffaa00";
                    } else if (v == "3") {
                        dis[i].style.backgroundColor = "#ff0000";
                    }
                }
            }

            function saveDot() {
                let inputs = document.querySelectorAll(".dot-gen-inputs-inp");
                let lines = [];
                for (let r = 0; r < 320; r++) {
                    let line = [];
                    for (let c = 0; c < 16; c++) {
                        line.push(inputs[r * 16 + c].value);
                    }
                    lines.push(line.join(""));
                }
                let blob = new Blob([lines.join("\n")], {
                    type: "text/plain",
                });
                let a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "dot.txt";
                a.click();
            }
        </script>
    </body>
</html>
