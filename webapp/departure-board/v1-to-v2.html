            <h1>発車標ドットデータ移行ツール</h1>
            <div class="update-date">2026/04/27作成 2026/04/27更新</div>
            <textarea id="in"></textarea>
            <button onclick="conv()">conv</button>
            <textarea id="out"></textarea>
        </main>
        <footer><!--/js/common.js で追加される--></footer>
        <script>
            function conv() {
                const data = document.getElementById("in").value;

                const rows = data.split("\n");
                const h = rows.length;
                const w = rows[0].length;
                const transposed = [];
                for (let x = 0; x < w; x++) {
                    let line = "";
                    for (let y = 0; y < h; y++) {
                        line += rows[y][x];
                    }
                    transposed.push(line);
                }

                document.getElementById("out").value = transposed.join("\n");
            }
        </script>
