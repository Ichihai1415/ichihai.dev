<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>MS Gothic Text to Dot Data</title>
    </head>
    <body>
        文字: <input id="text" type="text" /> 高さ<input
            id="h"
            type="number"
            value="16"
            style="width: 40px"
        />px 幅<input id="w" type="number" value="16" style="width: 40px" />px
        <label><input type="checkbox" id="autoW" checked />自動調整</label>
        <canvas id="cv" style="display: none"></canvas>
        <textarea
            id="out"
            style="width: 100%; height: 224px"
            wrap="off"
            readonly
        ></textarea>

        <script>
            const out = document.getElementById("out");

            document.getElementById("text").addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                    e.preventDefault();

                    const text = document.getElementById("text").value;
                    const H = 16;
                    if (document.getElementById("autoW").checked)
                        document.getElementById("w").value = text.length * H;
                    const W = document.getElementById("w").value;
                    const fontSize = 16;

                    const cv = document.getElementById("cv");
                    const ctx = cv.getContext("2d");

                    // 背景白
                    ctx.fillStyle = "#fff";
                    ctx.fillRect(0, 0, W, H);

                    // 黒で MS ゴシック描画
                    ctx.fillStyle = "#000";
                    ctx.font = `${fontSize}px "MS Gothic"`;
                    ctx.textBaseline = "top";
                    ctx.fillText(text, 0, 0);

                    // ピクセル取得
                    const img = ctx.getImageData(0, 0, W, H).data;

                    let lines = [];
                    for (let y = 0; y < H; y++) {
                        let row = "";
                        for (let x = 0; x < W; x++) {
                            const i = (y * W + x) * 4;
                            const r = img[i],
                                g = img[i + 1],
                                b = img[i + 2];

                            // 完全黒なら 1
                            const bit = r === 0 && g === 0 && b === 0 ? 1 : 0;
                            row += bit;
                        }
                        lines.push(row);
                    }

                    document.getElementById("out").value = lines.join("\n");

                    //navigator.clipboard.writeText(out.value);
                    //以下vscode内コピーできるよう
                    out.select();
                    //スマホ用？
                    out.setSelectionRange(0, out.value.length);
                    const success = document.execCommand("copy");
                }
            });

            out.addEventListener("click", (e) => {
                return;
                //navigator.clipboard.writeText(out.value);
                //以下vscode内コピーできるよう
                out.select();
                //スマホ用？
                out.setSelectionRange(0, out.value.length);
                const success = document.execCommand("copy");
            });
        </script>
    </body>
</html>
