        <script>
            display_init();

            function display_init() {
                const rows = 16;
                const columns = 16 * 20;

                let displays = 8;

                for (let d = 0; d < displays; d++) {
                    let div_display = document.createElement("div");
                    div_display.classList.add("ss-display");
                    div_display.id = "d" + d;
                    //console.log("d" + d);

                    for (let c = 0; c < columns; c++) {
                        let div_display_column = document.createElement("div");
                        div_display_column.classList.add("ss-display-column");
                        div_display_column.id = "d" + d + "-c" + c;

                        for (let r = 0; r < rows; r++) {
                            let div_display_column_row =
                                document.createElement("div");
                            div_display_column_row.classList.add(
                                "ss-display-column-row",
                            );
                            div_display_column_row.id =
                                "d" + d + "-c" + c + "-r" + r;

                            div_display_column.appendChild(
                                div_display_column_row,
                            );
                        }
                        div_display.appendChild(div_display_column);
                    }
                    document
                        .getElementById("ss-displays")
                        .appendChild(div_display);
                }
            }

                                const data_dc = data_tn[1].split(",");
                                data =
                                    "userInput\n" +
                                    data_dc[0].replaceAll("\\", "\n");
                                data = data.replaceAll("1", data_dc[1]);
                                break;
                        }

                        const lines = data.split(/\r?\n/);
                        const title = lines[0];

                        const rest = lines
                            .slice(1)
                            .filter((line) => line.trim() !== "");

                        let columns = rest[0].length;
                        let rows = rest.length;

                        for (let _c = 0; _c < columns; _c++) {
                            const c = cp + _c;
                            for (let r = 0; r < rows; r++) {
                                const char = rest[r].charAt(_c);
                                if (char != 0)
                                    if (Object.hasOwn(colors, char)) {
                                        document.getElementById(
                                            `d${d}-c${c}-r${r}`,
                                        ).style.backgroundColor = colors[char];
                                    }
                            }
                        }
                        cp += columns;
                    }
                }
            }
            color();

            function text2dot(text) {
                const texts = text.split("@");
                text = texts[0];
                const textLength =
                    texts.length == 2 ? Number(texts[1]) : text.length;

                const H = 16;
                const W = H * textLength;
                const fontSize = 16;

                const cv = document.createElement("canvas");
                const ctx = cv.getContext("2d");

                // 背景白
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, W, H);

                // 黒で MS ゴシック描画
                ctx.fillStyle = "#000";
                ctx.font = `${fontSize}px "MS Gothic"`;
                ctx.textBaseline = "top";
                ctx.fillText(text, 0, 0);

                // ピクセル取得
                const img = ctx.getImageData(0, 0, W, H).data;

                let lines = [];
                for (let y = 0; y < H; y++) {
                    let row = "";
                    for (let x = 0; x < W; x++) {
                        const i = (y * W + x) * 4;
                        const r = img[i],
                            g = img[i + 1],
                            b = img[i + 2];

                        // 完全黒なら 1
                        const bit = r === 0 && g === 0 && b === 0 ? 1 : 0;
                        row += bit;
                    }
                    lines.push(row);
                }

                return lines.join("\n");
            }
        </script>
