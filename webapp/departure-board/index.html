        <script defer type="module">
            let d = "bus/wakamatsu-1";

            fetch("displays/" + d + ".html")
                .then((response) => response.text())
                .then((html) => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");

                    const insertContent = doc.getElementById("target");
                    if (!insertContent)
                        console.error(
                            "見つかりませんでした。idを確認してください。",
                        );
                    else {
                        const insertTo = document.getElementById("target");
                        while (insertContent.firstChild) {
                            insertTo.appendChild(insertContent.firstChild);
                        }
                    }
                });
        </script>
