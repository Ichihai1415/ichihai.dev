        <header><!--/js/common.js で追加される--></header>
        <div class="info">
            <common-comment><!--/js/common.js で追加される--></common-comment>

            <div class="update-date">
                2026/05/22作成 2026/05/27更新 v1.0.1.1
            </div>
            <div class="info-green">
                <div class="info-green-head">【情報】</div>
                Windows以外の環境ではフォントの都合で表示が正しくできません（改善予定）。<br />
                処理が適当なので正しく表示されないことがあります（改善予定）。<br />
                ↓枠以外のどこかをクリックすると発車標本体以外は非表示になります。もう一度クリックすると再表示されます。<br />
            </div>
        </div>
        <div class="info2">
            <select id="select-d">
                <option value="bus/wakamatsu-1">
                    [リアルタイム]北鉄バス＠若松
                </option>
                <option value="train/kanazawa-1">金沢駅</option>
            </select>
            <button id="change">表示</button>
            <br />
            単品：<br />
            <a href="displays/bus/wakamatsu-1.html" target="_blank"
                >[リアルタイム]北鉄バス＠若松</a
            ><br />
            <a href="displays/train/kanazawa-1.html" target="_blank">金沢駅</a
            ><br />
        </div>

        <div
            class="departure-board"
            id="target"
            style="visibility: hidden"
        ></div>
        <footer><!--/js/common.js で追加される--></footer>
        <script defer type="module">
            import * as ichihai from "/js/ichihai.js";

            let d = ichihai.getParam("d");
            if (!d) d = "bus/wakamatsu-1";

            fetch("displays/" + d + ".html")
                .then((response) => response.text())
                .then((html) => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");

                    const insertContent = doc.getElementById("target");
                    if (!insertContent)
                        console.error(
                            "見つかりませんでした。idを確認してください。",
                        );
                    else {
                        const insertTo = document.getElementById("target");
                        while (insertContent.firstChild) {
                            const node = insertContent.firstChild;

                            if (node.tagName === "SCRIPT") {
                                const newScript =
                                    document.createElement("script");
                                if (node.type === "module")
                                    newScript.type = "module";
                                if (node.src) newScript.src = node.src;
                                else newScript.textContent = node.textContent;
                                insertTo.appendChild(newScript);
                                insertContent.removeChild(node);
                            } else insertTo.appendChild(node);
                        }
                    }
                });

            document.getElementById("change").onclick = () => {
                location.href =
                    "index.html?d=" + document.getElementById("select-d").value;
            };
        </script>
    </body>
