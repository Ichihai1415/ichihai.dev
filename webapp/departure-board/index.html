        <script>
            display_init();

            function display_init() {
                const rows = 16;
                const columns = 16 * 20;

                let displays = 8;

                for (let d = 0; d < displays; d++) {
                    let div_display = document.createElement("div");
                    div_display.classList.add("ss-display");
                    div_display.id = "d" + d;
                    //console.log("d" + d);

                    for (let c = 0; c < columns; c++) {
                        let div_display_column = document.createElement("div");
                        div_display_column.classList.add("ss-display-column");
                        div_display_column.id = "d" + d + "-c" + c;

                        for (let r = 0; r < rows; r++) {
                            let div_display_column_row =
                                document.createElement("div");
                            div_display_column_row.classList.add(
                                "ss-display-column-row",
                            );
                            div_display_column_row.id =
                                "d" + d + "-c" + c + "-r" + r;

                            div_display_column.appendChild(
                                div_display_column_row,
                            );
                        }
                        div_display.appendChild(div_display_column);
                    }
                    document
                        .getElementById("ss-displays")
                        .appendChild(div_display);
                }
            }
        </script>
