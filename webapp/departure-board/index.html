        <script>
            display_init();

            function display_init() {
                const div_displays = document.querySelectorAll("div.display");
                for (let di = 0; di < div_displays.length; di++) {
                    const div_display = div_displays[di];
                    const d = Number(div_display.id.replace("d", ""));
                    const rows = Number(div_display.getAttribute("db_r"));
                    const columns =
                        rows * Number(div_display.getAttribute("db_c"));

                    for (let c = 0; c < columns; c++) {
                        let div_display_column = document.createElement("div");
                        div_display_column.classList.add("display-column");
                        div_display_column.id = "d" + d + "-c" + c;

                        for (let r = 0; r < rows; r++) {
                            let div_display_column_row =
                                document.createElement("div");
                            div_display_column_row.classList.add(
                                "display-column-row",
                            );
                            div_display_column_row.id =
                                "d" + d + "-c" + c + "-r" + r;

                            div_display_column.appendChild(
                                div_display_column_row,
                            );
                        }
                        div_display.appendChild(div_display_column);
                    }
                }
            }
        </script>

            function text2dot(text) {
                const texts = text.split("@");
                text = texts[0];
                const textLength =
                    texts.length == 2 ? Number(texts[1]) : text.length;

                const H = 16;
                const W = H * textLength;
                const fontSize = 16;

                const cv = document.createElement("canvas");
                const ctx = cv.getContext("2d");

                // 背景白
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, W, H);

                // 黒で MS ゴシック描画
                ctx.fillStyle = "#000";
                ctx.font = `${fontSize}px "MS Gothic"`;
                ctx.textBaseline = "top";
                ctx.fillText(text, 0, 0);

                // ピクセル取得
                const img = ctx.getImageData(0, 0, W, H).data;

                let lines = [];
                for (let y = 0; y < H; y++) {
                    let row = "";
                    for (let x = 0; x < W; x++) {
                        const i = (y * W + x) * 4;
                        const r = img[i],
                            g = img[i + 1],
                            b = img[i + 2];

                        // 完全黒なら 1
                        const bit = r === 0 && g === 0 && b === 0 ? 1 : 0;
                        row += bit;
                    }
                    lines.push(row);
                }

                return lines.join("\n");
            }
