                    import * as ichihai from "/js/ichihai.js";

                    let isWeekDay = true;

                    );

                    let data_dr1da1 = [];
                    let data_dr2da1 = [];
                    let data_dr1da2 = [];
                    let data_dr2da2 = [];
                    timeTable.Routes.forEach((rt) => {
                        if (
                            rt.Number == "93" ||
                            rt.Number == "94" ||
                            rt.Number == "0_Kanazawa-Univ" ||
                            rt.Number == "97" ||

                            data_dr2da1.push(

                            data_dr1da2.push(
                                ...dia2simple(rt.Buses_Dir1_Dia2, rt.Number),
                            );
                            data_dr2da2.push(
                                ...dia2simple(rt.Buses_Dir2_Dia2, rt.Number),
                            );
                        } else {
                            data_dr1da1.push(
                                ...dia2simple(
                                    rt.Buses_Dir2_Dia1,
                                    rt.Number,
                                    "C",
                                ),
                            );
                            data_dr2da1.push(
                                ...dia2simple(
                                    rt.Buses_Dir1_Dia1,
                                    rt.Number,
                                    "D",
                                ),
                            );
                            data_dr1da2.push(
                                ...dia2simple(
                                    rt.Buses_Dir2_Dia2,
                                    rt.Number,
                                    "C",
                                ),
                            );
                            data_dr2da2.push(
                                ...dia2simple(
                                    rt.Buses_Dir1_Dia2,
                                    rt.Number,
                                    "D",
                                ),
                            );
                        }
                    });

                    //console.log(data_dr1da1);
                    //console.log(data_dr2da1);
                    //console.log(data_dr1da2);
                    //console.log(data_dr2da2);

                    let displayData_dr1 = [];
                    let displayData_dr2 = [];

                    function displayDataReset() {
                        displayData_dr1 = [];
                        displayData_dr2 = [];

                        if (isWeekDay) {
                            displayData_dr1 = isSchoolSemester
                                ? data_dr1da1
                                : data_dr1da1.filter(
                                      (row) => row[1] != "学期期間のみ",
                                  );
                            displayData_dr2 = isSchoolSemester
                                ? data_dr2da1
                                : data_dr2da1.filter(
                                      (row) => row[1] != "学期期間のみ",
                                  );
                        } else {
                            displayData_dr1 = isSchoolSemester
                                ? data_dr1da2
                                : data_dr1da2.filter(
                                      (row) => row[1] != "学期期間のみ",
                                  );
                            displayData_dr2 = isSchoolSemester
                                ? data_dr2da2
                                : data_dr2da2.filter(
                                      (row) => row[1] != "学期期間のみ",
                                  );
                        }
                        //console.log(displayData_dr1);
                        //console.log(displayData_dr2);

                        displayData_dr1.sort((a, b) => {
                            const toMinutes = (t) => {
                                const [h, m] = t.split(":").map(Number);
                                return h * 60 + m;
                            };
                            return toMinutes(a[2]) - toMinutes(b[2]);
                        });
                        displayData_dr2.sort((a, b) => {
                            const toMinutes = (t) => {
                                const [h, m] = t.split(":").map(Number);
                                return h * 60 + m;
                            };
                            return toMinutes(a[2]) - toMinutes(b[2]);
                        });
                    }

                    displayDataReset();

                    function getComeMinutes(timeStr) {
                        const now = new Date();
                        //now.setHours(0, 0, 0, 0); //任意時刻
                        const [h, m] = timeStr.split(":").map(Number);
                        return (
                            h * 60 +
                            m -
                            (now.getHours() * 60 + now.getMinutes())
                        );
                    }

                    function data_array2text(i, data, min) {
                        //console.log(data);
                        let st = `${i}$text:`;
                        switch (data[0]) {
                            case "92":
                            case "93":
                            case "94":
                            case "95":
                            case "96":
                            case "97":
                            case "99":
                                st += `${data[0]}@1,6;`;
                                break;
                            case "53":
                                st += `${data[0]}@1,7;`;
                                break;
                            default:
                                st += `@1;`;
                                break;
                        }

                        switch (data[1]) {
                            case "":
                            case "学期期間のみ":
                                if (min == 0) st += `まもなく到着,3;`;
                                else if (min < 10)
                                    st += ` 到着@2.5,4;約 ${min}分@3.5,1;`;
                                else if (min < 100)
                                    st += ` 到着@2.5,4;約${min}分@3.5,1;`;
                                else st += `@0.25;到着,4;約${min}分@3.75,1;`;
                                break;
                            case "快速":
                                if (min == 0) st += `快速,2;すぐ到着,3;`;
                                else if (min < 10)
                                    st += ` 快速@2.5,2;約 ${min}分@3.5,1;`;
                                else if (min < 100)
                                    st += ` 快速@2.5,2;約${min}分@3.5,1;`;
                                else st += `@0.25;快速@2,2;約${min}分@3.75,1;`;
                                break;
                            case "当バス停始発":
                                st += "当バス停始発,4;";
                                break;
                            default:
                                st += `@6;`;
                                break;
                        }
                        if (data[2].length == 4)
                            st += ` ${data[2].replace(":", "：")}@3,2;`;
                        else st += `${data[2].replace(":", "：")}@3,2;`;

                        let via = "";
                        switch (data[0]) {
                            case "92":
                            case "93":
                            case "97":
                            case "99":
                                via = "鈴見";
                                break;
                            case "94":
                            case "95":
                            case "96":
                            case "53":
                            case "0_Shiritsubyoin":
                                via = "旭町";
                                break;
                            default:
                                via = "";
                                break;
                        }

                        if (data[3] == "若松") st += "当バス停止まり,4;";
                        else if (via == "")
                            //
                            st += `@${(7 - data[3].length) / 2};${data[3]};@${(7 - data[3].length) / 2};`;
                        else if (data[3].length == 4)
                            st += `${via},4|dotId:destination/via,4|text:${data[3]};`;
                        else
                            st += `@${(4 - data[3].length) / 2};${via},4|dotId:destination/via,4|text:${data[3]};@${(4 - data[3].length) / 2};`;

                        st += `${data[4].replace("A", "Ａ").replace("B", "Ｂ").replace("C", "Ｃ").replace("D", "Ｄ")},2\n`;
                        return st;
                    }

                    async function runEveryMinute() {
                        let displaySt = "";

                        let d = 0;
                        for (let data of displayData_dr1) {
                            const min = getComeMinutes(data[2]);
                            if (min >= 0) {
                                //console.log(d);
                                displaySt += data_array2text(d, data, min);
                                d++;
                                if (d == 3) break;
                            }
                        }
                        if (d == 0)
                            displaySt +=
                                "0$text:☆☆☆,2;本日の運転は終了しました,1;☆☆☆,2\n";
                        d = 3;
                        for (let data of displayData_dr2) {
                            const min = getComeMinutes(data[2]);
                            if (min >= 0) {
                                displaySt += data_array2text(d, data, min);
                                d++;
                                if (d == 6) break;
                            }
                        }
                        if (d == 3)
                            displaySt +=
                                "3$text:☆☆☆,2;本日の運転は終了しました,1;☆☆☆,2\n";

                        //console.log(displaySt);
                        color(displaySt);
                    }

                    function getStopTimeId(stops, target) {
                        for (const stop of stops)
                            if (stop.Name == target)
                                return [stop.Time, stop.IdID];
                        return null;
                    }

                    function dia2simple(dia, num, id) {
                        let data = [];
                        dia.forEach((bus) => {
                            const timeId = getStopTimeId(bus.Stops, "若松");
                            if (timeId) {
                                let info = "";
                                if (bus.IsRapid) info = "快速";
                                if (bus.IsNotServiceDuringVacation)
                                    info = "学期期間のみ";
                                if (bus.Start == "若松") info = "当バス停始発";
                                data.push([
                                    num,
                                    info,
                                    timeId[0],
                                    bus.Destination,
                                    id ? id : timeId[1],
                                ]);
                            }
                        });
                        return data;
                    }

                    function startAt0s() {
                        const now = new Date();
                        const ms = now.getMilliseconds();
                        const sec = now.getSeconds();
                        const wait = (60 - sec) * 1000 - ms;
                        setTimeout(() => {
                            runEveryMinute();
                            setInterval(runEveryMinute, 60 * 1000);
                        }, wait);
                    }

                    startAt0s();

                    setTimeout(() => {
                        runEveryMinute();
                    }, 1000);
                </script>

                    data_lines[index] = content;

                    const datas_d = data_lines[d].split("|");
                    let cp = 0;
                    for (let ps = 0; ps < datas_d.length; ps++) {
                        const data_tn = datas_d[ps].split(":");
                        let data = null;
                        switch (data_tn[0]) {
                            case "text":
                                const tx_tcs = data_tn[1].split(";");
                                for (let ti = 0; ti < tx_tcs.length; ti++) {
                                    const tx_tc = tx_tcs[ti].split(",");
                                    let data_t = text2dot(tx_tc[0]);
                                    if (tx_tc.length > 1) {

                            case "dotId":

            function text2dot(text) {
                const texts = text.split("@");
                text = texts[0];
                const textLength =
                    texts.length == 2 ? Number(texts[1]) : text.length;

                const H = 16;
                const W = H * textLength;
                const fontSize = 16;

                const cv = document.createElement("canvas");
                const ctx = cv.getContext("2d");

                // 背景白
                ctx.fillStyle = "#fff";
                ctx.fillRect(0, 0, W, H);

                // 黒で MS ゴシック描画
                ctx.fillStyle = "#000";
                ctx.font = `${fontSize}px "MS Gothic"`;
                ctx.textBaseline = "top";
                ctx.fillText(text, 0, 0);

                // ピクセル取得
                const img = ctx.getImageData(0, 0, W, H).data;

                let lines = [];
                for (let y = 0; y < H; y++) {
                    let row = "";
                    for (let x = 0; x < W; x++) {
                        const i = (y * W + x) * 4;
                        const r = img[i],
                            g = img[i + 1],
                            b = img[i + 2];

                        // 完全黒なら 1
                        const bit = r === 0 && g === 0 && b === 0 ? 1 : 0;
                        row += bit;
                    }
                    lines.push(row);
                }

                return lines.join("\n");
            }

            function clearDisplay() {
                document
                    .querySelectorAll(".display-column-row")
                    .forEach((el) => {
                        el.style.backgroundColor = colors["0"];
                    });
            }

            clearDisplay();
