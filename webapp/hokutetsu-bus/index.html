    <body>
        <header><!--/js/common.js で追加される--></header>

        <main>
            <h1>北鉄バス金大付近運用表</h1>
            注意:
            私は知識がないので適当です。記録ミス等で誤りがある可能性があります。<br />
            塗装、所属？は最初に記録したものが代表として出ます。<br />
            2025/12/18以前のものは、ミスにより金沢駅と東金沢が混ざっている可能性があります。

            <h2>金沢大学方面</h2>
            <span id="dataCount-numbers_to-ku"></span><br />
            <table id="table_numbers_to-ku">
                <tr>
                    <th>番号</th>
                    <th>日付</th>
                    <th>時刻</th>
                    <th>場所（付近）</th>
                    <th>路線番号/路線名</th>
                    <th>塗装</th>
                    <th>所属？</th>
                    <th>コメント</th>
                </tr>
            </table>

            <h2>金沢駅方面</h2>
            <span id="dataCount-numbers_to-ks"></span><br />
            <table id="table_numbers_to-ks">
                <tr>
                    <th>番号</th>
                    <th>日付</th>
                    <th>時刻</th>
                    <th>場所（付近）</th>
                    <th>路線番号/路線名</th>
                    <th>塗装</th>
                    <th>所属？</th>
                    <th>コメント</th>
                </tr>
            </table>
        </main>

        <footer><!--/js/common.js で追加される--></footer>
        <script src="/js/common.js"></script>
        <script defer type="module">
            import * as ichihai from "/js/ichihai.js";

            ["numbers_to-ku", "numbers_to-ks"].forEach((file) => {
                ichihai.getRawData(file + ".csv").then((rawData) => {
                    const rows = rawData.split("\n");
                    let data = rows.map((row) =>
                        row.replace("\r", "").split(",")
                    );
                    data.shift();
                    data = data.filter((row) => row.length > 1);
                    //console.log(data);
                    const groups = {};

                    for (const row of data) {
                        const key = row[0];
                        if (!groups[key]) {
                            groups[key] = [];
                        }
                        groups[key].push(row);
                    }
                    const result = Object.values(groups);
                    document.getElementById("dataCount-" + file).innerText =
                        "count: " +
                        data.length +
                        ", numCount: " +
                        result.length;

                    //console.log(result);
                    const table = document.getElementById("table_" + file);
                    result.forEach((nums) => {
                        //console.log(nums);
                        let c = 0;
                        nums.forEach((row) => {
                            //console.log(row);
                            const tr = document.createElement("tr");
                            if (c == 0) {
                                //console.log("c=0");
                                const td_num = document.createElement("td");
                                td_num.textContent = row[0].split("_")[0];
                                td_num.rowSpan = nums.length;
                                tr.append(td_num);
                            }
                            const td_d = document.createElement("td");
                            td_d.textContent = row[2];
                            tr.append(td_d);

                            const td_t = document.createElement("td");
                            td_t.textContent = row[3];
                            tr.append(td_t);

                            const td_l = document.createElement("td");
                            td_l.textContent = row[4]
                                .replace("Kd", "金沢大学")
                                .replace("Kc", "金沢大学中央")
                                .replace("Ks", "金沢大学自然研前")
                                .replace("Kk", "金沢大学角間口")
                                .replace("ks", "角間新町")
                                .replace("w", "若松");
                            tr.append(td_l);

                            const td_ln = document.createElement("td");
                            td_ln.textContent = row[1] == "0" ? "(無)" : row[1];
                            tr.append(td_ln);

                            if (c == 0) {
                                let pi = 1;
                                nums.forEach((row_2) => {
                                    if (pi > 0) {
                                        if (
                                            row_2[5] != "" ||
                                            pi == nums.length
                                        ) {
                                            const td_p =
                                                document.createElement("td");
                                            td_p.textContent = row_2[5];
                                            td_p.rowSpan = nums.length;
                                            tr.append(td_p);
                                            pi = 0;
                                            return;
                                        }
                                        pi++;
                                    }
                                });
                                let di = 1;
                                nums.forEach((row_2) => {
                                    if (di > 0) {
                                        if (
                                            row_2[6] != "" ||
                                            di == nums.length
                                        ) {
                                            const td_s =
                                                document.createElement("td");
                                            td_s.textContent = row_2[6]
                                                .replace("k", "金沢")
                                                .replace("h", "白山");
                                            td_s.rowSpan = nums.length;
                                            tr.append(td_s);
                                            di = 0;
                                            return;
                                        }
                                        di++;
                                    }
                                });
                            }
                            const td_c = document.createElement("td");
                            td_c.textContent = row[7];
                            tr.append(td_c);

                            table.append(tr);
                            c++;
                        });
                    });
                });
            });
        </script>
    </body>
